<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-reviewed { background: #dbeafe; color: #1e40af; }
    .status-resolved { background: #d1fae5; color: #065f46; }
    .status-ignored { background: #f3f4f6; color: #6b7280; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Feedback Admin</h1>
      <button onclick="loadData()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
        Refresh
      </button>
    </div>

    <!-- Stats Cards -->
    <div id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8"></div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-3 mb-6 bg-white p-4 rounded-lg shadow-sm">
      <select id="filter-product" onchange="loadFeedbacks()" class="px-3 py-2 border rounded-lg text-sm bg-white">
        <option value="">All Products</option>
      </select>
      <select id="filter-type" onchange="loadFeedbacks()" class="px-3 py-2 border rounded-lg text-sm bg-white">
        <option value="">All Types</option>
        <option value="bug">Bug</option>
        <option value="suggestion">Suggestion</option>
        <option value="other">Other</option>
      </select>
      <select id="filter-status" onchange="loadFeedbacks()" class="px-3 py-2 border rounded-lg text-sm bg-white">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="reviewed">Reviewed</option>
        <option value="resolved">Resolved</option>
        <option value="ignored">Ignored</option>
      </select>
    </div>

    <!-- Feedback Table -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600">
          <tr>
            <th class="px-4 py-3 text-left font-medium">ID</th>
            <th class="px-4 py-3 text-left font-medium">Product</th>
            <th class="px-4 py-3 text-left font-medium">Type</th>
            <th class="px-4 py-3 text-left font-medium">Content</th>
            <th class="px-4 py-3 text-left font-medium">Contact</th>
            <th class="px-4 py-3 text-left font-medium">Device</th>
            <th class="px-4 py-3 text-left font-medium">Time</th>
            <th class="px-4 py-3 text-left font-medium">Status</th>
            <th class="px-4 py-3 text-left font-medium">Actions</th>
          </tr>
        </thead>
        <tbody id="feedback-list" class="divide-y divide-gray-100"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="flex items-center justify-between mt-4 text-sm text-gray-600"></div>
  </div>

  <script>
    const API = window.location.origin;
    let currentPage = 1;
    const pageSize = 20;

    async function loadData() {
      await Promise.all([loadProducts(), loadStats(), loadFeedbacks()]);
    }

    async function loadProducts() {
      const res = await fetch(`${API}/api/feedbacks/products`);
      const products = await res.json();
      const sel = document.getElementById('filter-product');
      const current = sel.value;
      sel.innerHTML = '<option value="">All Products</option>';
      products.forEach(p => {
        sel.innerHTML += `<option value="${p.product_id}">${p.product_id} (${p.count})</option>`;
      });
      sel.value = current;
    }

    async function loadStats() {
      const productId = document.getElementById('filter-product').value;
      const qs = productId ? `?product_id=${productId}` : '';
      const res = await fetch(`${API}/api/feedbacks/stats${qs}`);
      const stats = await res.json();
      document.getElementById('stats').innerHTML = `
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-2xl font-bold text-gray-900">${stats.total}</div>
          <div class="text-xs text-gray-500 mt-1">Total</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-2xl font-bold text-red-600">${stats.by_type.bug || 0}</div>
          <div class="text-xs text-gray-500 mt-1">Bugs</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-2xl font-bold text-blue-600">${stats.by_type.suggestion || 0}</div>
          <div class="text-xs text-gray-500 mt-1">Suggestions</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-2xl font-bold text-yellow-600">${stats.by_status.pending || 0}</div>
          <div class="text-xs text-gray-500 mt-1">Pending</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-2xl font-bold text-green-600">${stats.recent_7d}</div>
          <div class="text-xs text-gray-500 mt-1">Last 7 Days</div>
        </div>
      `;
    }

    async function loadFeedbacks() {
      const productId = document.getElementById('filter-product').value;
      const type = document.getElementById('filter-type').value;
      const status = document.getElementById('filter-status').value;

      const params = new URLSearchParams({ page: currentPage, page_size: pageSize });
      if (productId) params.set('product_id', productId);
      if (type) params.set('type', type);
      if (status) params.set('status', status);

      const res = await fetch(`${API}/api/feedbacks?${params}`);
      const data = await res.json();

      const tbody = document.getElementById('feedback-list');
      if (data.items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-12 text-center text-gray-400">No feedback yet</td></tr>';
      } else {
        tbody.innerHTML = data.items.map(f => {
          let deviceStr = '';
          if (f.device_info) {
            try {
              const d = JSON.parse(f.device_info);
              deviceStr = d.platform || d.userAgent?.substring(0, 30) || '-';
            } catch { deviceStr = '-'; }
          }
          return `
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-3 text-gray-500">${f.id}</td>
              <td class="px-4 py-3"><span class="px-2 py-0.5 bg-purple-100 text-purple-700 rounded text-xs">${f.product_id}</span></td>
              <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-xs ${f.type === 'bug' ? 'bg-red-100 text-red-700' : f.type === 'suggestion' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700'}">${f.type}</span></td>
              <td class="px-4 py-3 max-w-xs truncate" title="${escapeHtml(f.content)}">${escapeHtml(f.content)}</td>
              <td class="px-4 py-3 text-gray-500">${f.contact || '-'}</td>
              <td class="px-4 py-3 text-gray-400 text-xs">${deviceStr || '-'}</td>
              <td class="px-4 py-3 text-gray-500 whitespace-nowrap">${formatTime(f.created_at)}</td>
              <td class="px-4 py-3">
                <select onchange="updateStatus(${f.id}, this.value)" class="px-2 py-1 rounded text-xs border status-${f.status}">
                  <option value="pending" ${f.status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="reviewed" ${f.status === 'reviewed' ? 'selected' : ''}>Reviewed</option>
                  <option value="resolved" ${f.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                  <option value="ignored" ${f.status === 'ignored' ? 'selected' : ''}>Ignored</option>
                </select>
              </td>
              <td class="px-4 py-3">
                <button onclick="deleteFeedback(${f.id})" class="text-red-400 hover:text-red-600 text-xs">Delete</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      // Pagination
      const totalPages = Math.ceil(data.total / pageSize);
      document.getElementById('pagination').innerHTML = `
        <span>Showing ${data.items.length} of ${data.total} feedbacks</span>
        <div class="flex gap-2">
          <button onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} class="px-3 py-1 border rounded hover:bg-gray-100 disabled:opacity-30">Prev</button>
          <span class="px-3 py-1">${currentPage} / ${totalPages || 1}</span>
          <button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} class="px-3 py-1 border rounded hover:bg-gray-100 disabled:opacity-30">Next</button>
        </div>
      `;

      loadStats();
    }

    async function updateStatus(id, status) {
      await fetch(`${API}/api/feedback/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadFeedbacks();
    }

    async function deleteFeedback(id) {
      if (!confirm('Delete this feedback?')) return;
      await fetch(`${API}/api/feedback/${id}`, { method: 'DELETE' });
      loadFeedbacks();
    }

    function goPage(page) {
      if (page < 1) return;
      currentPage = page;
      loadFeedbacks();
    }

    function formatTime(t) {
      if (!t) return '-';
      const d = new Date(t + 'Z');
      return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadData();
  </script>
</body>
</html>
