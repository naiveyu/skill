server {
    listen 80;
    server_name sspprriinngg.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sspprriinngg.cn;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/sspprriinngg.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sspprriinngg.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Static website
    root /opt/inote/website;
    index index.html;

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }

    # Admin dashboard
    location /admin {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Release downloads (proxy to Qiniu CDN)
    location /releases/ {
        proxy_pass http://releases.sspprriinngg.cn/;
        proxy_set_header Host releases.sspprriinngg.cn;
        proxy_buffering off;
    }

    # AI-Note website (basePath: /ai-note)
    location /ai-note/ {
        alias /opt/inote/website/;
        try_files $uri $uri.html $uri/ /ai-note/index.html;
    }

    # Website static fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
